apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: result-portal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: result-portal
  minReplicas: 3
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 10
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
