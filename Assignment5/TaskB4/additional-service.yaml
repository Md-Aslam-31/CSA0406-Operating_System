apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lms
  template:
    metadata:
      labels:
        app: lms
    spec:
      containers:
        - name: lms
          image: result-portal:compose
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_NAME
              value: Learning Management Service
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: lms
spec:
  selector:
    app: lms
  ports:
    - port: 80
      targetPort: 8000
