name: Assignment 4 Linux evidence
on:
  push:
    paths:
      - 'Assignment4/**'
      - '.github/workflows/assignment4-linux.yml'
  workflow_dispatch:
jobs:
  linux-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plotting dependency
        run: python -m pip install matplotlib
      - name: Run Assignment 4 suite
        run: bash Assignment4/scripts/run_linux_evidence.sh
      - name: Upload outputs and plots
        uses: actions/upload-artifact@v4
        with:
          name: assignment4-linux-evidence
          path: |
            Assignment4/evidence/*
            Assignment4/plots/*.png
