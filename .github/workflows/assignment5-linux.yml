name: Assignment 5 Linux deployment evidence
on:
  push:
    paths:
      - '.github/workflows/assignment5-linux.yml'
      - 'Assignment5/**'
      - '!Assignment5/evidence/**'
      - '!Assignment5/plots/**'
      - '!Assignment5/REPORT.md'
      - '!Assignment5/REPORT.pdf'
      - '!Assignment5/REPORT.docx'
  workflow_dispatch:
jobs:
  linux-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install plot dependency
        run: python -m pip install matplotlib
      - name: Run Linux design and deployment lab
        run: bash Assignment5/scripts/run_linux_evidence.sh
      - name: Commit generated command outputs and charts
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assignment5/evidence/ Assignment5/plots/
          git add -f Assignment5/evidence/run.log
          if ! git diff --cached --quiet; then
            git commit -m "Record Assignment 5 Linux evidence run ${GITHUB_RUN_ID}"
            git push
          fi
      - name: Upload command outputs, measurements and charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assignment5-linux-evidence
          path: |
            Assignment5/evidence/**
            Assignment5/plots/*.png
          if-no-files-found: warn
