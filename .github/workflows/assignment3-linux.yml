name: Assignment 3 Linux evidence
on:
  push:
    paths:
      - 'Assignment3/**'
      - '.github/workflows/assignment3-linux.yml'
  workflow_dispatch:
jobs:
  linux-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plotting dependency
        run: python -m pip install matplotlib
      - name: Run Assignment 3 suite
        run: bash Assignment3/scripts/run_linux_evidence.sh
      - name: Upload outputs and plots
        uses: actions/upload-artifact@v4
        with:
          name: assignment3-linux-evidence
          path: |
            Assignment3/evidence/*
            Assignment3/plots/*.png
