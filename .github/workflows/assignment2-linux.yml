name: Assignment 2 Linux evidence
on:
  push:
    paths:
      - 'Assignment2/**'
      - '.github/workflows/assignment2-linux.yml'
  workflow_dispatch:
jobs:
  linux-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run Assignment 2 suite
        run: bash Assignment2/scripts/run_linux_evidence.sh
      - name: Upload raw output and measurements
        uses: actions/upload-artifact@v4
        with:
          name: assignment2-linux-evidence
          path: Assignment2/evidence/*
